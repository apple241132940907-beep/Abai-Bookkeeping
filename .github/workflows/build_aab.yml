name: Build AAB

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build AAB
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          echo "===== Current directory ====="
          pwd

          echo "===== Files ====="
          ls -la

          echo "===== All important files ====="
          find . -maxdepth 4 -type f \
            \( -name "gradlew" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle-wrapper.properties" \
            \) -print

      - name: Check Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found."
            echo "Please make sure the Gradle wrapper is included in the repository."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper found."
          ./gradlew --version

      - name: Build Release AAB
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Find AAB
        if: success()
        run: |
          echo "===== Searching for AAB ====="
          find . -type f -name "*.aab" -print

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: |
            */.aab
          if-no-files-found: error
          retention-days: 7
          
