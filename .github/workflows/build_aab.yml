name: Build AAB

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build AAB
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Check project
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Build AAB
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Find AAB
        run: |
          echo "Searching for AAB files..."
          find . -type f -name "*.aab" -print

      - name: Check AAB
        run: |
          AAB_COUNT=$(find . -type f -name "*.aab" | wc -l)

          echo "Found $AAB_COUNT AAB file(s)."

          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "ERROR: No AAB file was generated."
            exit 1
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: |
            */.aab
          if-no-files-found: error
          retention-days: 7
          
