name: Build Android AAB

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build AAB
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. 下載程式碼
      - name: Checkout
        uses: actions/checkout@v6

      # 2. 設定 Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. 確保 Gradle Wrapper 可以執行
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 檢查 Java / Gradle
      - name: Check environment
        run: |
          java -version
          ./gradlew --version

      # 5. 建立 Release AAB
      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace

      # 6. 找出產生的 AAB
      - name: Find AAB
        run: |
          echo "AAB files:"
          find . -type f -name "*.aab"

      # 7. 上傳 AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: |
            */build/outputs/bundle/release/.aab
          if-no-files-found: error
          retention-days: 7
          
